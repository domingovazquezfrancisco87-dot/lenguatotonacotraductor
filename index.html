<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lengua Totonaca Traductor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#FFFBEB}
header{background:linear-gradient(135deg,#7A3E1F,#A85D3A);color:white;padding:18px;text-align:center}
main{max-width:750px;margin:auto;padding:10px}
.card{background:white;border-radius:16px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:14px}
.box{border:2px solid #7A3E1F;border-radius:16px;padding:12px;background:white;margin-bottom:14px}
.box.esp{border-color:#1B5E20}
textarea{width:100%;padding:12px;font-size:16px;border-radius:10px;border:2px solid #E7D9C0;min-height:70px}
.res{min-height:0;margin-top:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:#FFFBEB;border-radius:12px;margin:8px 0;border:1px solid #f0e0c0}
.img-real{width:110px;height:80px;object-fit:cover;border-radius:10px;border:2px solid #D4A76A;flex-shrink:0}
.visual{width:110px;height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#FFF3C4,#FFE0B2);border:2px solid #D4A76A;flex-shrink:0}
.audio{width:34px;height:34px;border-radius:50%;border:none;background:#7A3E1F;color:white;cursor:pointer}
</style>
</head>
<body>
<header><h1>🌽 Traductor Totonaco</h1><p id="cont">Cargando...</p></header>
<main>
<div class="card" style="border:2px solid #D4A76A;background:#FFFEF5">
<h3 style="text-align:center;color:#7A3E1F;margin:0 0 8px">📖 3 Raíces</h3>
<div style="background:#E8F5E9;padding:10px;border-radius:10px;margin:6px 0"><b>1. Puhmalhkuy = fogón</b> → puh + mah + lhkuyath</div>
<div style="background:#FFF3C4;padding:10px;border-radius:10px;margin:6px 0"><b>2. Kuxlhanchuh = pan</b> → kuh + xlhah + chuh</div>
<div style="background:#FCE4EC;padding:10px;border-radius:10px"><b>3. Puksnankakgakg = pápalo</b> → puks + nahan + kakg</div>
</div>

<div class="box esp">
<h3 style="text-align:center;color:#1B5E20">🇲🇽 → 🌽 Español → Totonaco</h3>
<textarea id="q1" placeholder="Escribe: hola, sol, lluvia, luna..." oninput="trad1()"></textarea>
<div id="r1" class="res"></div>
</div>

<div class="box">
<h3 style="text-align:center;color:#7A3E1F">🌽 → 🇲🇽 Totonaco → Español</h3>
<textarea id="q2" placeholder="Escribe: skalhni, chichineh, sen..." oninput="trad2()"></textarea>
<div id="r2" class="res"></div>
</div>
</main>
<script>
const base=[{tot:"skalhni",esp:"hola"},{tot:"paxtahkatsinilh",esp:"gracias"},{tot:"paxkeyaw",esp:"amamos"},{tot:"chikeh",esp:"casa"},{tot:"chicheh",esp:"perro"},{tot:"chuchut",esp:"agua"},{tot:"lhkuy",esp:"arde, quema, fuego"},{tot:"papah",esp:"luna"},{tot:"papáh",esp:"luna"},{tot:"puskat",esp:"mujer"},{tot:"chixkuh",esp:"hombre"},{tot:"kaman",esp:"niños"},{tot:"tsumath",esp:"niña"},{tot:"Kgawasa'",esp:"niño"},{tot:"lhakchajan",esp:"personas"},{tot:"tachiwin",esp:"palabra, idioma"},{tot:"chuh",esp:"tortilla"},{tot:"kuxeh",esp:"maíz"},{tot:"xanath",esp:"flor"},{tot:"kuyuh",esp:"armadillo"},{tot:"chiwix",esp:"piedra"},{tot:"tiyath",esp:"tierra"},{tot:"kiweh",esp:"arbol, tronco"},{tot:"akgapun",esp:"cielo"},{tot:"lakgapasnih",esp:"conocido"},{tot:"paxneh",esp:"cerdo"},{tot:"kuh",esp:"corazón"},{tot:"talhapaxken",esp:"amor"},{tot:"tapaxaw",esp:"feliz"},{tot:"makan",esp:"mano"},{tot:"lakatun",esp:"lado, lateral"},{tot:"kgawiweh",esp:"frío"},{tot:"lhkakgah",esp:"picante"},{tot:"lakapun",esp:"cara"},{tot:"chichi'",esp:"caliente"},{tot:"tlan",esp:"bien, bueno"},{tot:"anin",esp:"hay"},{tot:"min",esp:"viene"},{tot:"kachiken",esp:"pueblo"},{tot:"an",esp:"va, van"},{tot:"mitseh",esp:"gato"},{tot:"puxkuh",esp:"jefe, patriarca, presidente"},{tot:"pin",esp:"chile"},{tot:"stapuh",esp:"frijol"},{tot:"kapen",esp:"café"},{tot:"kuxlhanchuh",esp:"pan"},{tot:"taway",esp:"comida, alimento"},{tot:"kotnan",esp:"bebe, ingiere"},{tot:"tahlhtath",esp:"dormir, sueño"},{tot:"lakatith",esp:"gusto, atraccion"},{tot:"tlankah",esp:"grande"},{tot:"atsow",esp:"poco,reducido"},{tot:"lhuwah",esp:"mucho, exagerado"},{tot:"kgalhtuhchokgoh",esp:"rio"},{tot:"nanah",esp:"abuela"},{tot:"tatáh",esp:"abuelo"},{tot:"tseh",esp:"mamá"},{tot:"tlath",esp:"papá"},{tot:"skgatah",esp:"bebe,tierno, hijo"},{tot:"pukglhneh",esp:"nube"},{tot:"sen",esp:"lluvia"},{tot:"on",esp:"viento"},{tot:"kilhtahmakuh",esp:"día"},{tot:"putum",esp:"todos"},{tot:"mik",esp:"nieve"},{tot:"tsisníh",esp:"noche"},{tot:"lahgastapuh",esp:"ojo"},{tot:"kankan",esp:"nariz"},{tot:"kilhnih",esp:"boca"},{tot:"lhkuyath",esp:"fuego"},{tot:"tijeh",esp:"camino"},{tot:"akith",esp:"yo"},{tot:"wix",esp:"tú"},{tot:"aktum",esp:"uno"},{tot:"aktiy",esp:"dos"},{tot:"aktutuh",esp:"tres"},{tot:"tahtlakneh",esp:"música"},{tot:"tachanán",esp:"siembra"},{tot:"tlaktlah",esp:"elote"},{tot:"akgxiweth",esp:"jilote"},{tot:"xawath",esp:"milpa"},{tot:"kgaweth",esp:"nixtamal"},{tot:"xwateh",esp:"metate"},{tot:"puhxpahtan",esp:"molcajete"},{tot:"kgalhtawakgah",esp:"aprendizaje"},{tot:"tahkahtsin",esp:"conocimiento, sabiduria"},{tot:"tawan",esp:"hoja"},{tot:"wath",esp:"tamal"},{tot:"tsikan",esp:"abuela, vieja, curandera"},{tot:"Kgolhoh",esp:"abuelo, sabio, viejo"},{tot:"talakapastaknih",esp:"recuerdos"},{tot:"talakgalhin",esp:"maldad, dañado, enfermo"},{tot:"sipih",esp:"cerro"},{tot:"kgachuchut",esp:"manantial"},{tot:"tuxtunath",esp:"ojo de agua, yacimiento"},{tot:"puxkgah",esp:"barranca"},{tot:"kahlhinakgath",esp:"selva, monte"},{tot:"kahkiwen",esp:"bosque"},{tot:"kgahsakgatneh",esp:"pastizal"},{tot:"kahsakgatneh",esp:"pastizal"},{tot:"xalakpuwan",esp:"Cuetzalan"},{tot:"kgoyom",esp:"Huehuetla"},{tot:"kahtsakgathkiweh",esp:"Olintla"},{tot:"kahtsakatneh",esp:"Olintla"},{tot:"olintla",esp:"Olintla"},{tot:"kahjalhan",esp:"chipawatlan"},{tot:"kahmiyakgneh",esp:"Espinal"},{tot:"tutuhnahkuh",esp:"totonaco"},{tot:"tihpalhuwah",esp:"variado"},{tot:"xlhexneh",esp:"diferentes"},{tot:"xmanwah",esp:"unico"},{tot:"kawasah",esp:"niño pequeño"},{tot:"tahlhah",esp:"hermano"},{tot:"palmah",esp:"hierba"},{tot:"chichineh",esp:"sol"},{tot:"kugkoh",esp:"tío"},{tot:"nahpah",esp:"tía"},{tot:"puxnamath",esp:"sobrina/o"},{tot:"tahkgilhtsukuth",esp:"origen, familia"},{tot:"tapaxuwan",esp:"alegria, fiesta"},{tot:"kahtawan",esp:"rancho"},{tot:"seagnah",esp:"plátano"},{tot:"lhaxux",esp:"naranja"},{tot:"xukuth",esp:"limón"},{tot:"jakah",esp:"mamey"},{tot:"lhakgtsohpin",esp:"chile piquin"},{tot:"tahchan",esp:"sembrar"},{tot:"lakxtakan",esp:"cosechar"},{tot:"makgtayan",esp:"ayudante"},{tot:"pulakglhaman",esp:"trabajo comunitario"},{tot:"tamahkgtay",esp:"ayuda mutua"},{tot:"xla kilhmaku",esp:"mole"},{tot:"lhtukguth",esp:"atole"},{tot:"pulakgtlhah",esp:"tamal de frijol"},{tot:"spituh",esp:"pájaro"},{tot:"tsikgtsih",esp:"pájaro pequeño"},{tot:"lakatin chuhuwit",esp:"cenzontle"},{tot:"kukuy",esp:"luciérnaga"},{tot:"stukuh",esp:"estrella"},{tot:"gilheh",esp:"trueno"},{tot:"makglipnah",esp:"relampago"},{tot:"chigith",esp:"granizo"},{tot:"aktsineh",esp:"señor de los truenos"},{tot:"pupuhnuh",esp:"neblina"},{tot:"stakuhmik",esp:"sereno"},{tot:"lhkakgnan",esp:"calor del sol"},{tot:"tayah",esp:"pararse"},{tot:"tawilhah",esp:"sentarse"},{tot:"tlahtlawan",esp:"caminar"},{tot:"palha",esp:"rápido"},{tot:"tahkgosniy",esp:"correr"},{tot:"tahtlen",esp:"canto"},{tot:"lhakgawan",esp:"parecido"},{tot:"lakgwan",esp:"selecto"},{tot:"tantlhenen",esp:"bailadores"},{tot:"paxkatsinilh",esp:"gracias"},{tot:"kgalhkgawan",esp:"balbucear"},{tot:"tahlhitseh",esp:"reír"},{tot:"tahsan",esp:"llorar"},{tot:"tahsitseh",esp:"enojo"},{tot:"kgamanan",esp:"jugar"},{tot:"masath",esp:"venado"},{tot:"stillah",esp:"ardilla"},{tot:"jun",esp:"colibrí"},{tot:"spun",esp:"tortola"},{tot:"stantahs",esp:"paloma"},{tot:"wayah",esp:"gavilan"},{tot:"puwuyan",esp:"lechuza"},{tot:"monkgxneh",esp:"tecolote"},{tot:"pumahkgalhtawakgah",esp:"escuela"},{tot:"pumakgalhtawakgah",esp:"escuela"},{tot:"tahtsokgneh",esp:"escrito"},{tot:"lhitsokgnih",esp:"lapiz"},{tot:"tahlhkamaxtoh",esp:"libro"},{tot:"tsokgnan",esp:"escribe"},{tot:"pukgalha",esp:"leer"},{tot:"kaxmata",esp:"enseñar"},{tot:"kgalhtawakgamah",esp:"aprender"},{tot:"lakgapastakgmah",esp:"pensar"},{tot:"tlan tachiwin",esp:"buena palabra"},{tot:"kgalhakgaxmath",esp:"escuchar"},{tot:"lakgalhchuwin",esp:"hablar"},{tot:"lakgoyum",esp:"abuelos"},{tot:"kimpalakachixkuwin",esp:"niños"},{tot:"lakgatankuwin",esp:"mañana"},{tot:"kgahkgotunun",esp:"tarde"},{tot:"puxstaneh",esp:"mercado"},{tot:"lhixtapalhaneh",esp:"dinero"},{tot:"xlah lhkuyat chichineh",esp:"fiesta del sol"},{tot:"yohualichan",esp:"Yohualichan"},{tot:"laktlawan",esp:"sendero"},{tot:"lhakgapaxkeyan",esp:"te quiero mucho"}];
const dic=[...new Map(base.map(o=>[o.tot.toLowerCase(),o])).values()];
let REALES={}; let AUD={};
const VISUALES={"skalhni":"👋","chikeh":"🏠","chuchut":"💧","lhkuyath":"🔥","chichineh":"☀️","papah":"🌙","papáh":"🌙","chuh":"🫓","kuxeh":"🌽","wath":"🫔","sen":"🌧️","pukglhneh":"☁️","kahlhinakgath":"🌿","olintla":"🏘️","pumakgalhtawakgah":"🏫","pumahkgalhtawakgah":"🏫"};

async function cargaTodo(){
 try{
  let r1=await fetch(`https://api.github.com/repos/domingovazquezfrancisco87-dot/lenguatotonacotraductor/contents/audios?t=${Date.now()}`);
  let j1=await r1.json(); j1.filter(a=>/\.(m4a|mp3|wav|ogg)$/i.test(a.name)).forEach(a=>{AUD[a.name.replace(/\.[^/.]+$/,"").toLowerCase()]=`audios/${a.name}`;});
 }catch(e){}
 try{
  let r2=await fetch(`https://api.github.com/repos/domingovazquezfrancisco87-dot/lenguatotonacotraductor/contents/imagenes?t=${Date.now()}`);
  let j2=await r2.json(); j2.filter(a=>/\.(jpg|jpeg|png|webp)$/i.test(a.name)).forEach(a=>{REALES[a.name.replace(/\.[^/.]+$/,"").toLowerCase()]=a.name;});
 }catch(e){}
 document.getElementById("cont").innerText=`${dic.length} palabras · ${Object.keys(AUD).length} audios · ${Object.keys(REALES).length} fotos reales`;
}
function norm(t){return t.toLowerCase().trim();}
function play(t){let u=AUD[norm(t)]; if(u){new Audio(encodeURI(u)).play();return;} let s=new SpeechSynthesisUtterance(t); s.lang="es-MX"; s.rate=0.8; speechSynthesis.speak(s);}
function makeImg(tot){
 let k=tot.toLowerCase();
 if(REALES[k]) return `<img src="imagenes/${REALES[k]}" class="img-real" onerror="this.style.display='none'">`;
 return `<div class="visual">${VISUALES[k]||'🌽'}</div>`;
}
function card(x){
 let img=makeImg(x.tot);
 return `<div class="row">${img}<div style="flex:1"><div style="font-weight:800;color:#1B5E20"><button class="audio" onclick="play('${x.tot.replace(/'/g,"\\'")}')">🔊</button> ${x.tot}</div><div style="font-size:13px">${x.esp}</div></div></div>`;
}
let bloqueado=false;
function trad1(){
 if(bloqueado) return;
 let q=document.getElementById("q1").value.toLowerCase().trim();
 let d=document.getElementById("r1");
 if(!q){d.innerHTML=""; if(!bloqueado){bloqueado=true; document.getElementById("q2").value=""; document.getElementById("r2").innerHTML=""; bloqueado=false;} return;}
 let f=dic.filter(x=>x.esp.toLowerCase().includes(q));
 d.innerHTML=f.slice(0,15).map(card).join("")||`<div style="text-align:center;font-size:11px;color:#8a7a63">No encontrado</div>`;
 if(f.length){ bloqueado=true; document.getElementById("q2").value=f[0].tot; document.getElementById("r2").innerHTML=f.slice(0,1).map(card).join(""); bloqueado=false; }
}
function trad2(){
 if(bloqueado) return;
 let q=document.getElementById("q2").value.toLowerCase().trim();
 let d=document.getElementById("r2");
 if(!q){d.innerHTML=""; if(!bloqueado){bloqueado=true; document.getElementById("q1").value=""; document.getElementById("r1").innerHTML=""; bloqueado=false;} return;}
 let f=dic.filter(x=>x.tot.toLowerCase().includes(q));
 d.innerHTML=f.slice(0,15).map(card).join("")||`<div style="text-align:center;font-size:11px;color:#8a7a63">No encontrado</div>`;
 if(f.length){ bloqueado=true; document.getElementById("q1").value=f[0].esp; document.getElementById("r1").innerHTML=f.slice(0,1).map(card).join(""); bloqueado=false; }
}
cargaTodo();
</script>
</body>
</html>
